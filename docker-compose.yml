# Impera CAM — full stack on one machine (local today, a VM later).
#
#   docker compose up -d --build                 API, CPU workers, beat, MySQL, Redis
#   docker compose --profile gpu up -d           + GPU OCR worker (Linux VM with
#                                                  nvidia-container-toolkit)
#
# On a Windows laptop the GPU OCR worker runs natively instead — see README
# "Scanned statements". It reaches MySQL and Redis on 127.0.0.1 and reads the
# same ./data/uploads and ./output folders mounted here.

x-app-env: &app-env
  BSX_ENV: ${BSX_ENV:-dev}
  BSX_MYSQL_URL: mysql+pymysql://${MYSQL_USER:-impera}:${MYSQL_PASSWORD:-impera-dev-password}@db/impera_cam
  BSX_REDIS_URL: redis://redis:6379/0
  BSX_JWT_SECRET: ${BSX_JWT_SECRET:-CHANGE-ME-IN-PRODUCTION}
  BSX_JWT_EXPIRE_HOURS: ${BSX_JWT_EXPIRE_HOURS:-24}
  BSX_ALLOWED_ORIGINS: ${BSX_ALLOWED_ORIGINS:-http://localhost:8000}
  BSX_UPLOAD_DIR: /data/uploads
  BSX_OUTPUT_DIR: /data/output
  BSX_MAX_UPLOAD_MB: ${BSX_MAX_UPLOAD_MB:-40}
  BSX_MAX_FILES: ${BSX_MAX_FILES:-25}
  BSX_RETENTION_SECONDS: ${BSX_RETENTION_SECONDS:-21600}
  BSX_TENANT_MAX_ACTIVE_FILES: ${BSX_TENANT_MAX_ACTIVE_FILES:-50}
  BSX_BROKER_VISIBILITY_SECONDS: ${BSX_BROKER_VISIBILITY_SECONDS:-2400}
  BSX_LOGIN_PER_MINUTE: ${BSX_LOGIN_PER_MINUTE:-10}
  BSX_REGISTER_PER_HOUR: ${BSX_REGISTER_PER_HOUR:-5}
  BSX_WORKERS: ${BSX_CPU_WORKERS:-8}

x-app-volumes: &app-volumes
  - ./data/uploads:/data/uploads
  - ./output:/data/output

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--max_connections=300"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: impera_cam
      MYSQL_USER: ${MYSQL_USER:-impera}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-impera-dev-password}
    ports:
      # this machine only; 3307 so it never collides with a MySQL already on 3306
      - "127.0.0.1:${BSX_DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # persistence off: queued task messages (which carry encrypted PDF
    # passwords) must never be written to disk
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"          # for a native GPU worker on this machine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "${BSX_API_WORKERS:-4}", "--proxy-headers"]
    environment:
      <<: *app-env
      BSX_DB_POOL_SIZE: "10"
      BSX_DB_MAX_OVERFLOW: "10"
    ports:
      # IPv4 only: Docker Desktop's IPv6 (::1) forwarder on Windows stalls
      # under ~100 concurrent connections (measured 2026-10-15); "localhost"
      # clients fall back to 127.0.0.1 at once
      - "0.0.0.0:8000:8000"
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-cpu:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "-Q", "cpu",
              "-c", "${BSX_CPU_WORKERS:-8}", "-n", "cpu@%h", "--loglevel", "INFO"]
    stop_grace_period: 2m              # warm shutdown: files in flight finish first
    environment:
      <<: *app-env
      BSX_DB_POOL_SIZE: "2"
      BSX_DB_MAX_OVERFLOW: "2"
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *app-env
      BSX_DB_POOL_SIZE: "2"
      BSX_DB_MAX_OVERFLOW: "2"
    volumes: *app-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-ocr:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "-Q", "ocr",
              "--pool", "solo", "-n", "ocr@%h", "--loglevel", "INFO"]
    stop_grace_period: 35m             # an OCR file may run up to its 35-minute hard limit
    environment:
      <<: *app-env
      BSX_OCR_BACKEND: paddle
      BSX_OCR_DEVICE: gpu
      BSX_DB_POOL_SIZE: "2"
      BSX_DB_MAX_OVERFLOW: "2"
    volumes: *app-volumes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  mysql_data:
